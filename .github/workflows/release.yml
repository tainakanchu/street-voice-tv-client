name: Build & Release APK

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Derive version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          CORE="${VERSION_NAME%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          for part in "$MAJOR" "$MINOR" "$PATCH"; do
            if ! [[ "$part" =~ ^[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
            fi
          done
          # 10#: no octal parsing of leading zeros. MINOR / PATCH get 3 digits each, so they
          # must stay below 1000 or version codes would collide / go backwards.
          MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))
          if (( MINOR >= 1000 || PATCH >= 1000 )); then
            echo "::error::MINOR and PATCH must be < 1000 (got $MINOR.$PATCH)"; exit 1
          fi
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          # Android's versionCode limit.
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode $VERSION_CODE exceeds 2100000000"; exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android-tv/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
