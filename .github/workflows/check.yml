name: Check

on:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric (Android 15 / SDK 35) needs JDK 21 at test runtime;
          # the app itself still targets Java 17 bytecode.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile (type check)
        run: ./gradlew compileDebugKotlin

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot tests (Roborazzi verify)
        run: ./gradlew verifyRoborazziDebug

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            android-tv/app/build/outputs/roborazzi
            android-tv/app/build/reports/tests
          if-no-files-found: ignore

      - name: Android Lint
        run: ./gradlew lintDebug
